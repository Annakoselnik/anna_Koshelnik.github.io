<section class="event-promo @@class">
    <h2 class="event-promo__title">@@title</h2>
    <div class="event-promo__info-block">
        <div class="event-promo__left">
            <time datetime="@@datetime" class="event-promo__date first-line">
                @@date
            </time>
            <p class="event-promo__place second-line">
                @@place
            </p>
        </div>

        <picture class="event-promo__picture">
            <source type="image/webp" media="(max-width: 1019px)" srcset="assets/images/event/sade_main-tablet.webp">
            <source media="(max-width: 1019px)" srcset="assets/images/event/sade_main-tablet.jpg">
            <source type="image/webp" srcset="assets/images/event/sade_main.webp">
            <img src="assets/images/event/sade_main.jpg" alt="@@alt" class="event-promo__img">
        </picture>

        <div class="event-promo__right">
            <p class="event-promo__time">
                <time datetime="@@datetime" class="first-line">@@time</time>
                <span class="event-promo__time-label">начало</span>
            </p>
            <p class="event-promo__address second-line">
                @@address
            </p>
        </div>
    </div>
</section>
